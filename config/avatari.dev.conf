# avatari, on a development workstation.
#
# Passed with --config by `make renderer`. Unset keys keep avatari's built-in
# defaults, and the defaults are relative paths resolved from avatari's own
# directory — which is where the renderer is started — so this file only says
# what differs.
#
# The appliance's equivalent is distros/inteliboy/files/etc/avatari.conf, which
# names /usr/share paths because the packages put them there.

# The VRM head rather than the placeholder head.glb. 17 MB and 44 morph
# targets; head.glb is the fallback that exists so the renderer boots without
# it.
# Relative, like every default above: `make renderer` starts avatari from
# its own checkout, so this is that checkout's assets directory. It named
# an absolute path under one developer's home and worked on one machine.
model.head = assets/AvatariBoy.vrm

# Audio on. avatari opens ALSA, which on this workstation reaches WSLg's
# PulseAudio through ~/.asoundrc. If the device is not there it says so once
# and renders on regardless — lipsync never depended on playback.
audio.enabled = true

# The voice, declared here because this is where the appliance declares it.
#
# Worth knowing: **nothing inside avatari reads these keys.** They are
# `.renderer = false` — config the renderer carries on behalf of whoever
# speaks, which in this deployment is cogiti's speech adapter. The renderer
# receives finished viseme timings and has no idea which engine produced them,
# which is exactly the split that lets the engine change without it noticing.
voice.engine = azure
voice.name   = en-US-AndrewMultilingualNeural
