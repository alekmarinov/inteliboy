# InteliBoy's cogiti, on a development workstation.
#
#     make talk           text only, cheapest
#     make face           start avatari, then talk to it
#
# On the appliance this file is /etc/cogiti.conf and names absolute paths; here
# it names a checkout. Every setting can still be overridden by a COGITI_* env
# var or a --flag, and `bin/cogiti --print-config` says which won.
#
# **Paths here are relative to this file**, not to wherever you ran make from,
# and `~` is your home. So `./commands.toml` is the one beside this file and
# `../../reflexi` is the sibling checkout — which means this file works in
# anybody's clone, in any directory. It used to name one developer's home
# directory in eight places and worked on exactly one machine.
#
# Nothing in this file is a cogiti default. cogiti has no opinion about which
# model runs or which engine speaks; that is what this file is for.

state_dir = ~/.local/state/cogiti

# The agent port. Required — there is no default, because naming one would mean
# cogiti had an opinion about which model runs.
agent_adapter = ../adapters/anthropic/.venv/bin/python ../adapters/anthropic/adapter.py
agent_secrets = ANTHROPIC_API_KEY=anthropic.api_key

# The speech port, out half. Azure Speech, falling back to espeak-ng when the
# network or the key is not there — a cloud voice is an improvement when it is
# reachable and never a dependency.
speech_adapter = ../adapters/azure/speak

# What that adapter is given. Named, not valued: the store holds the values and
# nothing here or in git ever does.
speech_secrets = AZURE_SPEECH_KEY=azure.speech_key, AZURE_SPEECH_REGION=azure.speech_region

# The presentation port. A socket, and the renderer may not be there yet — a
# missing one is a normal state, not a configuration error.
presentation_adapter = /tmp/avatari.sock

# Also print, because this workstation has no working audio and a silent
# lipsync is hard to read from a terminal.
output = text

# The resolver port: reflexi, linked in. A library and its compiled knowledge,
# both or neither. Without them every utterance goes to the model — which
# ports.md allows, and which costs seconds and money to turn the volume up.
resolver_library = ../../reflexi/build/debug/libreflexi.so
resolver_blob    = ../../reflexi/build/reflexi.blob
resolver_config  = ../../reflexi/config/thresholds.toml

# What fills a slot declared `context_default: device.location`.
device_location  = Sofia

# What a resolved intent does. An intent with no entry escalates.
command_table    = ./commands.toml

# Cards. A template turns a result into scene ops and is data, so a new card is
# not a new build.
presentation_dir = ./presentation

# Hosts a job may reach. Empty would mean a job may reach nothing, which is the
# right default but makes for a dull demonstration.
egress_hosts = example.com, api.github.com

trace_file = /tmp/cogiti-trace.jsonl
