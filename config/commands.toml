# InteliBoy's command table — a resolved intent, and what it does.
#
# One section per reflexi intent id (`../reflexi/intents/*.yaml`). An intent
# with no section here escalates to the model, which is not a failure: it is a
# device that has not been taught that yet.
#
# Adding a command is editing this file. See ../cogiti/docs/command-table.md.
#
# `speak` is a template, never model output. A local command has a known shape
# and the device saying it the same way every time is the point; prose is what
# escalation is for.

# ------------------------------------------------------------------ time --

[get_time]
provider = "clock.now"
speak    = "It's {time_spoken}."
# A named template in config/presentation/. A bare string would also work and
# is right for a one-line display; this one is a card.
present  = "clock_card"

[get_date]
provider = "clock.today"
speak    = "It's {date_spoken}."
present  = "date_card"

# --------------------------------------------------------- conversation --
#
# No provider work to do, and giving them one would be pretending. They are
# here so they do not cost an API call and two seconds.

[greeting]
provider = "conversation.acknowledge"
speak    = "Hello."
present  = "none"

[thanks]
provider = "conversation.acknowledge"
speak    = "Any time."
present  = "none"

# ---------------------------------------------------------------- audio --
#
# The device's mixer, through the shell provider. `command` is a list, so
# nothing reaches a shell, and a slot substituted into an entry stays one
# argument — `set_volume` with "70; rm -rf /" passes amixer a single argument
# containing a semicolon, which it rejects.
#
# amixer on the appliance; this workstation has no card, so it answers
# "I can't do that on this device" rather than pretending.

[volume_up]
provider   = "shell.run"
command    = ["amixer", "-q", "sset", "Master", "10%+"]
speak      = "Turned it up."
present    = "none"
timeout_ms = 1000
source     = "alsa"

[volume_down]
provider   = "shell.run"
command    = ["amixer", "-q", "sset", "Master", "10%-"]
speak      = "Turned it down."
present    = "none"
timeout_ms = 1000
source     = "alsa"

[mute]
provider   = "shell.run"
command    = ["amixer", "-q", "sset", "Master", "mute"]
speak      = "Muted."
present    = "none"
timeout_ms = 1000

[unmute]
provider   = "shell.run"
command    = ["amixer", "-q", "sset", "Master", "unmute"]
speak      = "Unmuted."
present    = "none"
timeout_ms = 1000

[set_volume]
provider   = "shell.run"
command    = ["amixer", "-q", "sset", "Master", "{level}%"]
speak      = "Volume {level} percent."
present    = "none"
timeout_ms = 1000

  [set_volume.args]
  # `ask` is the wording for a missing slot. Without it, "set the volume" with
  # no number escalates to the model — which works, and costs seconds and money
  # to learn a number the resolver could have been told.
  level = { slot = "level", required = true, ask = "What level? Nought to a hundred." }

# ------------------------------------------------------------ dangerous --
#
# reflexi returns `confirm` for these and cogiti will not auto-answer it, will
# not let it expire into yes, and will not let an agent answer it. The field
# below is only the wording.
#
# The command is deliberately NOT `poweroff` on a development workstation.
# Point it at the real thing in the appliance's own table.

[power_off]
provider   = "shell.run"
command    = ["true"]
confirm    = "Shut down the device?"
speak      = "Goodbye."
present    = "none"
timeout_ms = 2000

[reboot]
provider   = "shell.run"
command    = ["true"]
confirm    = "Restart the device?"
speak      = "Restarting."
present    = "none"
timeout_ms = 2000

# ------------------------------------------------------------------ jobs --
#
# A timer outlives its turn, so it is a job and not a command — command-table.md
# is emphatic that forcing one into the table is how a device ends up pausing
# for two seconds in the middle of a conversation.
#
# `announce` is what it says when it fires, which may be an hour later with
# nobody having asked anything.

[set_timer]
job      = "timer"
speak    = "Timer set for {duration_human}."
announce = "Your timer for {duration_human} is up."
present  = "none"

  [set_timer.args]
  duration = { slot = "duration", required = true, ask = "For how long?" }

[cancel_timer]
job     = "cancel_timer"
speak   = "Cancelled {title}."
present = "none"
