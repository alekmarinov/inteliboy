# InteliBoy - an assistant with presentational skills.
#
# The distro is the whole appliance. avatari is the renderer it runs; brain
# services will join it later under their own names.
ID=inteliboy
NAME="InteliBoy"
VERSION=0.2.1
CODENAME=firstlight
PRETTY_NAME="InteliBoy 0.2.1"
DISTRO_HOSTNAME=inteliboy
HOME_URL="https://github.com/alekmarinov/inteliboy"

# Strip the binaries. The appliance never debugs itself, and gcc alone leaves
# over a gigabyte of unstripped compiler internals in /usr/libexec otherwise -
# it is only here because Mesa needs libstdc++ and LFS ships that with the
# compiler.
STRIP=1

# Three seconds, hidden. The screen is black either way, so this costs nothing
# visible; what it buys is a window you can actually hit. Zero would mean grub
# never reads the keyboard at all, and one second turned out to be too tight -
# the firmware takes Esc for its own setup menu, so the press has to land
# after the vendor logo clears and before the kernel starts.
GRUB_TIMEOUT=3

# quiet + loglevel=0 silence the kernel. They do not silence the boot scripts,
# which write their own progress to /dev/console - measured, the screen still
# filled with 'Starting the avatari renderer... [ OK ]' and the rest. console=tty3
# sends both to a VT nobody is looking at, leaving tty1 black until the renderer
# paints it. vt.global_cursor_default=0 removes the blinking cursor.
#
# udev.log_level=err is the last of them. udev logs through the kernel ring
# buffer, so its 'Using default interface naming scheme' and one line per
# renamed interface survive both quiet and loglevel=0 and were the only text
# left on screen. Its own log level is the thing that silences it.
#
# modprobe.blacklist=nouveau is not about noise, it is about a crash. On the
# GL553VE nouveau oopses probing the discrete card - gm200_devinit_post, then
# 'preinit failed with -110' - because the signed firmware that generation
# needs is not shipped. An oops prints at a priority no loglevel setting
# suppresses, so the trace lands on screen whatever else is quietened. The
# laptop's panel is driven by i915 regardless, so nothing is lost here.
#
# It does cost the X79 desktop, whose only GPU is the NVIDIA one: with
# nouveau blacklisted it falls back to the firmware framebuffer through
# simpledrm and Mesa renders in software. The menu entry '(with nouveau)'
# exists for that machine - press Esc during the first second to reach it.
# net.ifnames=0 for the same reason as every other distro here: one image boots
# on several machines and the interface config is written for eth0.
KERNEL_CMDLINE="net.ifnames=0 quiet loglevel=0 vt.global_cursor_default=0 console=tty3 udev.log_level=err modprobe.blacklist=nouveau"

# The image size in MB. Big enough for the assembled tree plus room to install
# into afterwards. 7G still fits an 8G USB stick. This was one number in .env
# for every distro until 2026-08-31; the value is unchanged, but each distro
# can now be sized for what it actually holds once that has been measured.
IMAGE_SIZE=7168
