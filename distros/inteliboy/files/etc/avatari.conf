# InteliBoy's avatari configuration.
#
# This is distros/inteliboy/files/etc/avatari.conf, copied over the assembled
# tree and replacing the default the avatari package installs. It is the seam
# between the two repos: which head, which font, which voice is the distro's
# decision, and changing any of it needs no rebuild of avatari at all.
#
# Keep it in step with the package default by hand - 'make check-config' in
# the avatari tree diffs the shipped file against the table in config.c, but
# nothing checks this copy.
#
# avatari.conf — the seam between the renderer and the distro that ships it.
#
# This is the file `make install` puts at /etc/avatari.conf. It is kept in the
# repository at etc/ rather than at the root on purpose: ./avatari.conf is the
# *first* place the renderer looks, so a copy sitting in the source tree would
# point a development checkout at the target's install paths and stop it
# starting. The distro's files/ overlay replaces this after installation.
#
# Read from ./avatari.conf, then /etc/avatari.conf. --config overrides both.
# Precedence is: built-in default, then this file, then a command-line flag.
#
# Format is flat `key = value`, with `#` starting a comment. There are no
# sections; dotted names keep the parser a loop rather than a state machine
# and cost the target no new dependency.
#
# A PATH SET HERE MUST EXIST. If it does not, the renderer stops at startup
# and prints the file, the line and the path it could not find. That is
# deliberate: this is an appliance with no login and no console, and a silent
# fallback to a different font — or to no text at all — is an afternoon spent
# looking in the wrong place. Keys left commented out fall back to a built-in
# search of the working directory and then /usr/share/avatari, which is what
# lets a source checkout run without being installed.
#
# `avatari --print-config` reports every setting, its value, and whether it
# came from a default, this file (with the line number), or a flag.

# --- assets the distro supplies -------------------------------------------
#
# Fonts are not ours. We ship none, install none, and vendor none: the image
# already carries DejaVu, and the symbol face is the distro's to add.

font.text          = /usr/share/fonts/dejavu/DejaVuSans.ttf

# The symbol face, used per glyph when the text face has no glyph for one — a
# sun, a cloud, a currency sign. Commented out because `make install` does not
# create it: uncomment once the distro's files/ overlay puts a face there, and
# a typo will then be caught at boot rather than showing tofu boxes.
#
#font.symbol       = /usr/share/avatari/fonts/fallback.ttf

# AvatariBoy is the character InteliBoy presents as. head.glb ships beside it
# in the same package and is the fallback if this one ever fails to load.
model.head         = /usr/share/avatari/heads/AvatariBoy.vrm

# Degrees about Y. VRM 0.x and VRM 1.0 disagree on which way forward is, so
# leaving this unset lets the loader take what the file implies; setting it
# overrides that for an asset that gets it wrong.
#model.yaw         = 180

# Everything below the neck is hidden by default (CLAUDE.md §10).
model.show_body    = false

# --- data tables ----------------------------------------------------------
#
# Plain text, editable on the target without a rebuild. The phoneme-to-viseme
# mapping in particular is meant to be tuned by ear.

data.visemes       = /usr/share/avatari/data/visemes.txt
data.expressions   = /usr/share/avatari/data/expressions.txt
data.morph_aliases = /usr/share/avatari/data/morph-aliases.txt

# Only debug builds read shaders from disk; release builds embed them and
# ignore this entirely.
shaders.dir        = /usr/share/avatari/shaders

# --- the control socket ---------------------------------------------------
#
# The brain connects here and sends timed animation commands. The renderer
# knows nothing of speech recognition or language models (CLAUDE.md §3), so
# moving the brain to another host means changing this end and nothing else.

ipc.socket         = /run/avatari.sock
ipc.enabled        = true

# --- audio ----------------------------------------------------------------
#
# Off by default. Lipsync is driven by the viseme queue rather than by the
# audio clock, so the face is correct and testable in silence.

# On. The mixer is unmuted by /etc/rc.d/init.d/alsa before the renderer starts,
# and the HDA codec drivers are built into the InteliBoy kernel so the card
# exists without waiting for udev.
audio.enabled      = true
audio.device       = default

# --- rendering ------------------------------------------------------------
#
# Animation always runs at a fixed 60 Hz; this is only how often a frame is
# drawn when nothing is moving. 0 draws every frame.

render.idle_fps    = 20

# Advisory. The KMS backend takes the connector's preferred mode instead and
# reports the real size back to the main loop.
render.width       = 1280
render.height      = 720

# --- devices --------------------------------------------------------------
#
# Empty means discover: card0 through card7 are tried in order and the first
# that can modeset wins. Name one to pin a machine with more than one GPU —
# a named device that cannot modeset is an error rather than a fall-through,
# because quietly driving the wrong output is worse than not starting.

display.device     =
input.device_dir   = /dev/input

# --- voice: read by the brain, not by the renderer ------------------------
#
# The renderer never links espeak-ng or Piper and never speaks; it is handed
# viseme timings and plays them (CLAUDE.md §3, §6). These keys are here
# anyway, and that is a decision rather than an oversight:
#
#   - It is one appliance. Two config files are two things for the distro's
#     files/ overlay to keep in step, and one of them will drift.
#   - The renderer warns about keys it does not know, so that a config newer
#     than the binary says so. If the brain's keys were unknown here, every
#     boot would warn about all of them and the warning would stop meaning
#     anything.
#   - --print-config is the diagnostic story for a box with no console. Half
#     a picture is worth much less than the whole one.
#
# So the renderer knows these keys, carries them, prints them, and consumes
# none of them.

voice.engine       = espeak-ng     # espeak-ng | piper | azure | none
voice.name         = en_US-kristin-medium
voice.rate         = 1.0
voice.pitch        = 1.0

# Not installed by `make install` — voice models ship in their own tarball
# (`make dist-assets`) because they are 60 MB each and change on a different
# cadence to the code. Uncomment once one is in place.
#
#voice.model       = /usr/share/avatari/voices/en_US-kristin-medium.onnx
