# InteliBoy's brain, on the appliance.
#
# The development equivalent is config/cogiti.dev.conf in the inteliboy
# repository, which names a checkout; this names where the packages put things.
# Everything here can still be overridden by a COGITI_* variable or a flag, and
# `cogiti --print-config` says which won.

# Everything the device remembers. /var, not a partition of its own — an image
# update destroys it, and for now that is accepted: the job table and any
# running timers are the only things in it, and neither is worth a reboot.
#
# The credentials below are the exception and are baked into the image instead.
# See changes/2026-09-01-user-owned-credentials/brief.md, which explains why
# that is wrong as a product and right for now.
state_dir = /var/lib/cogiti

# The resolver. A linked library and its compiled knowledge, both or neither.
resolver_library = /usr/lib/libreflexi.so
resolver_blob    = /usr/share/reflexi/reflexi.blob
resolver_config  = /etc/reflexi-thresholds.toml
device_location  = Sofia

# What a resolved intent does, and what it looks like.
command_table    = /etc/cogiti/commands.toml
presentation_dir = /etc/cogiti/presentation

# The face. A socket, and the renderer may not be up yet — a missing one is a
# normal state, not a configuration error.
presentation_adapter = /run/avatari.sock

# Ears and voice: one adapter, both directions, because echo cancellation needs
# the played and the captured samples in one clock domain.
#
# --no-offline: the image ships the streaming recogniser only. Whisper is
# 245 MB for the final transcript alone and the streaming model's own final
# resolves perfectly well.
#
# --barge-in is deliberately absent. It is asserted by a deployment that has
# measured it, and nobody has measured it on this hardware yet:
# audi/tools/echo_test.py, run on the device.
#
# No --tts either, so this image LISTENS BUT DOES NOT SPEAK. Answers appear on
# the face and are not said aloud. The voice needs espeak-ng, which lfs has no
# recipe for yet, and avatari-say, which avatari does not install — both
# bounded, neither done. Leaving them out of the first image keeps a build that
# is meant to prove the listening path from also being the first test of a
# package that does not exist.
speech_in_adapter = /usr/bin/audi --no-offline

# The model. Required — cogiti has no default, because naming one would be
# having an opinion about which model runs.
agent_adapter = /usr/bin/inteliboy-agent
agent_secrets = ANTHROPIC_API_KEY=anthropic.api_key

# Hosts a job may reach. Empty would mean nothing, which is the right default
# and a dull device.
egress_hosts = api.github.com, example.com

# The face speaks; nothing prints. A console here would draw over the renderer.
output = none

trace_file = /var/log/cogiti-trace.jsonl
