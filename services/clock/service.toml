# The simplest possible service, and the one that proves the path.
#
# It needs no network, no secret and no configuration, so when it fails the
# failure is in the supervisor or the SDK and nowhere else. That is the whole
# reason it exists and is why it ships first.
name        = "clock"
title       = "the clock"
namespace   = "clock"
region      = "periphery"
exec        = ["python3", "main.py"]
interval_s  = 10

[limits]
cpu_seconds  = 5        # it formats a string; five is generous
memory_mb    = 64
open_files   = 16
processes    = 2

[network]
allow = []              # and so it may reach nothing at all

[secrets]
require = []

# Validated and unused in 5a — reaching a service by voice is 5c. Written now
# so the format is settled before an agent generates one.
[phrases]
patterns = ["show the clock", "pin the clock"]
