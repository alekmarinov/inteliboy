# The second service, and the one that proves the broker.
#
# It reaches exactly one host, declared here, and cogiti enforces that on the
# far side of a socket — the service cannot open one of its own. In 5b this
# list is read aloud at the review gate, which is why it is exact hosts and
# never wildcards.
name        = "weather"
title       = "the weather"
namespace   = "weather"
region      = "periphery"
exec        = ["python3", "main.py"]
interval_s  = 900

[limits]
cpu_seconds  = 10
memory_mb    = 96
open_files   = 32
processes    = 2

[network]
allow = ["api.open-meteo.com"]

[secrets]
require = []            # this one needs no key, which is why it was chosen

[phrases]
patterns = ["show the weather", "pin the weather"]
