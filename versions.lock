audi       = { version = "0.2.0-2-ga77f58e", commit = "a77f58e2dc45000b6ce96db3c4fc08d11864cf4d" }
inteliboy  = { version = "0.3.0", commit = "37e18c80292ad6137a1f20785afc7f3805c59f4d" }

# Proven: InteliBoy 0.3.0, built and booted 2026-09-03. 29 of 29 on the image,
# 13 of 14 on the device — the miss is a capture device, which a virtual
# machine does not have.
#
# The new thing, and the reason this release exists: the running appliance was
# asked for a picture of its own screen and produced one. It showed the
# resting face, centred, with nothing pinned — which is exactly what a fresh
# image should show now that no services ship. Until this build, that sentence
# could only be written by somebody standing in front of the device.
#
# It was also the first image booted on a *copy*: a VM writes to what it
# boots, so 0.2.2 was flashed carrying a clock service born during its own
# verification. An image that has been verified must be the same image that
# was verified.
