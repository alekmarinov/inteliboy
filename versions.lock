# Proven: InteliBoy 0.1.0, built 2026-09-02 from exactly the commits above and
# booted under qemu the same evening. It identified itself as 0.1.0, took ssh
# by key, started the renderer and the brain, resolved an utterance through
# reflexi, and passed tools/verify-device.sh 13 of 14. The miss is "there is a
# capture device", which a virtual machine does not have; the same suite reaches
# 14 of 14 on the hardware at .165.
#
# tools/verify-image.sh checked the image itself for all thirteen changes that
# release was about, and found them.
#
# One caveat, and it is the reason this line is not simply "proven": the
# adapters were staged from a DIRTY tree — `inteliboy = ff37791-dirty` — because
# this repository was being edited while the build ran. The adapters directory
# itself was not among the edits, so the content is believed to be ff37791's,
# but "believed" is the honest word: that tarball cannot be reproduced from a
# commit. The next build is clean and this note goes away with it.
